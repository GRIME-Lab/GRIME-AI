name: Nightly Build
on:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  workflow_dispatch:      # allows manual trigger from GitHub UI
jobs:
  nightly:
    name: Nightly Conda Build
    runs-on: ubuntu-latest
    container: quay.io/condaforge/linux-anvil-cos7-x86_64
    outputs:
      built: ${{ steps.check.outputs.built }}
      package_version: ${{ steps.check.outputs.package_version }}
    steps:
      - name: Checkout repo
        run: |
          cd $GITHUB_WORKSPACE
          source /opt/conda/etc/profile.d/conda.sh
          conda activate base
          git clone -b $GITHUB_REF_NAME $GITHUB_SERVER_URL/$GITHUB_REPOSITORY .

      - name: Decide whether to build
        id: check
        run: |
          source /opt/conda/etc/profile.d/conda.sh
          conda activate base
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(git log -1 --format=%cd --date=format:%Y-%m-%d)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run. Building."
          elif [ "$LAST" != "$TODAY" ]; then
            echo "No commits today. Nothing to build."
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          sed -i "s/^BUILD_DATE = .*/BUILD_DATE = \"$TODAY\"/" src/GRIME_AI/version.py

          SW=$(grep -Po '(?<=^SW_VERSION = ")[^"]+' src/GRIME_AI/version.py)
          PKGVER="${SW}.dev$(date -u +%Y%m%d%H%M)"

          echo "Building $PKGVER"
          echo "built=true" >> $GITHUB_OUTPUT
          echo "package_version=$PKGVER" >> $GITHUB_OUTPUT

      - name: Build and upload to dev label
        if: steps.check.outputs.built == 'true'
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          GRIME_PKG_VERSION: ${{ steps.check.outputs.package_version }}
        run: |
          source /opt/conda/etc/profile.d/conda.sh
          conda activate base
          conda install conda-forge-pinning=2024.11.29.12.37.53 -y
          conda config --set anaconda_upload yes
          conda build -c grimelab -e /opt/conda/conda_build_config.yaml \
          --label dev --user grimelab --token $ANACONDA_API_TOKEN recipe/grime-ai
          conda clean -a -y

  nightly-container:
    name: Nightly Container Build
    runs-on: ubuntu-latest
    needs: nightly
    if: needs.nightly.outputs.built == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Assemble image metadata
        id: version
        env:
          PKG_VERSION: ${{ needs.nightly.outputs.package_version }}
        run: |
          python - <<'EOF'
          import os
          pkgver = os.environ["PKG_VERSION"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={pkgver}\n")
              out.write(f"commit={os.environ['GITHUB_SHA'][:7]}\n")
              out.write(f"package_name=grimelab/label/dev::grime-ai={pkgver}\n")
          EOF
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.commit }}
            type=raw,value=nightly
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./recipe
          file: ./recipe/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GRIME_PACKAGE=${{ steps.version.outputs.package_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
